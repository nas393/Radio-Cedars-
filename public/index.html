<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>وردة · Wardé</title>
  <meta name="description" content="راديو لبنان، أخبار لبنان وتلفزيون لبنان المباشر في مكان واحد، لكل لبناني بعيد عن البيت.">
  <meta name="theme-color" content="#0E1F19">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <a class="skip" href="#news" data-i18n="skipToNews">انتقل إلى الأخبار</a>

  <header class="top">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#cedar"/></svg>
      <span class="brand-name" data-i18n="brand">وردة</span>
    </div>
    <div class="here" aria-live="off">
      <p class="clock">
        <span class="clock-city" data-i18n="beirut">بيروت</span>
        <time class="clock-time" id="beirut-time"></time>
        <span class="weather" id="weather" hidden></span>
      </p>
      <p class="clock clock-local" id="local-clock" hidden>
        <span class="clock-city" data-i18n="yourTime">عندك</span>
        <time class="clock-time" id="local-time"></time>
      </p>
    </div>
    <button class="lang" id="lang-toggle" type="button" lang="en">English</button>
  </header>

  <main>
    <!-- The radio: the one loud thing on the page -->
    <section class="radio" aria-labelledby="radio-heading">
      <h1 class="visually-hidden" id="radio-heading" data-i18n="radioHeading">راديو لبنان</h1>

      <p class="morning" id="morning" hidden>
        <span data-i18n="morning">صباح الخير. فيروز الصبح؟</span>
        <button type="button" class="link-btn" id="morning-btn" data-i18n="morningAction">شغّل فيروز</button>
      </p>

      <div class="set">
        <div class="now">
          <button class="power" id="power" type="button" aria-pressed="false" aria-label="تشغيل">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
          </button>
          <div class="now-text">
            <p class="station-name" id="station-name" dir="auto" aria-live="polite">…</p>
            <p class="station-status" id="station-status" aria-live="polite"></p>
          </div>
          <div class="eq" id="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <button class="fav" id="fav" type="button" aria-pressed="false" aria-label="أضف إلى المفضلة">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.9z"/></svg>
          </button>
        </div>

        <div class="dial">
          <div class="dial-scale" id="dial" tabindex="0" role="listbox" aria-label="المحطات" data-i18n-label="stations">
            <p class="dial-loading" data-i18n="loadingStations">جاري تحميل المحطات…</p>
          </div>
          <div class="needle" aria-hidden="true"></div>
        </div>
        <p class="dial-hint" data-i18n="dialHint">اسحب المؤشر لتغيير المحطة</p>
      </div>

      <div class="filters" role="group" aria-label="تصفية المحطات" data-i18n-label="filterStations">
        <button type="button" class="chip" data-filter="all" aria-pressed="true" data-i18n="filterAll">كل المحطات</button>
        <button type="button" class="chip" data-filter="fav" aria-pressed="false" data-i18n="filterFav">المفضلة</button>
        <button type="button" class="chip" data-filter="fairuz" aria-pressed="false" data-i18n="filterFairuz">فيروز</button>
      </div>

      <audio id="audio" preload="none"></audio>
    </section>

    <div class="lower">
      <!-- News -->
      <section class="news" id="news" aria-labelledby="news-heading" tabindex="-1">
        <div class="section-head">
          <h2 id="news-heading" data-i18n="newsHeading">أخبار من لبنان</h2>
          <button type="button" class="link-btn" id="news-refresh" data-i18n="refresh">تحديث</button>
        </div>
        <div class="tabs" role="tablist" id="news-tabs" aria-labelledby="news-heading"></div>
        <div class="headlines" id="headlines" role="tabpanel" aria-live="polite">
          <p class="quiet" data-i18n="loadingNews">جاري تحميل الأخبار…</p>
        </div>
        <p class="updated" id="news-updated"></p>
      </section>

      <!-- TV -->
      <section class="tv" aria-labelledby="tv-heading">
        <h2 id="tv-heading" data-i18n="tvHeading">تلفزيون مباشر</h2>
        <ul class="channels" id="channels"></ul>
        <p class="quiet small" data-i18n="tvNote">يفتح البث المباشر على يوتيوب.</p>
      </section>
    </div>
  </main>

  <footer class="foot">
    <p data-i18n="footer">المحطات من دليل Radio Browser المجاني. الأخبار تتجدد كل ١٠ دقائق.</p>
  </footer>

  <!-- Cedar mark, drawn once and reused -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="cedar" viewBox="0 0 32 32">
      <path d="M16 3 L22 10 H19 L25 17 H21 L28 25 H4 L11 17 H7 L13 10 H10 Z" fill="currentColor"/>
      <rect x="14.5" y="25" width="3" height="4" rx="0.5" fill="currentColor"/>
    </symbol>
  </svg>

  <script src="/app.js" defer></script>
</body>
</html>
