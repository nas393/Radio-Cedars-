<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonWave Radio — Hear the world glow</title>
    <style>
        :root {
            --cyan: #00F0FF; --cyan-dim: rgba(0,240,255,0.4); --cyan-glow: 0 0 20px rgba(0,240,255,0.6),0 0 60px rgba(0,240,255,0.3);
            --magenta: #FF00E5; --magenta-dim: rgba(255,0,229,0.4); --magenta-glow: 0 0 20px rgba(255,0,229,0.6),0 0 60px rgba(255,0,229,0.3);
            --deep-space: #0A0A14; --deep-space-alt: #0D0D1A; --wireframe: #1A1A2E;
            --glow-white: #E0F0FF; --glow-white-dim: rgba(224,240,255,0.6);
            --gold: #FFD700; --gold-dim: rgba(255,215,0,0.4);
            --font-display: 'Space Grotesk',sans-serif; --font-ui: 'Inter',sans-serif; --font-mono: 'JetBrains Mono',monospace;
            --radius-sm: 8px; --radius-md: 16px; --radius-lg: 24px;
            --transition-fast: 150ms ease; --transition-normal: 300ms ease; --transition-slow: 600ms cubic-bezier(0.4,0,0.2,1);
        }
        *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
        html,body { height:100%; overflow:hidden; }
        body { font-family:var(--font-ui); background:var(--deep-space); color:var(--glow-white); -webkit-font-smoothing:antialiased; }
        .app-container { display:flex; flex-direction:column; height:100vh; height:100dvh; max-width:600px; margin:0 auto; position:relative; overflow:hidden; }
        .app-header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; z-index:100; background:linear-gradient(180deg,var(--deep-space) 60%,transparent); }
        .logo { display:flex; align-items:center; gap:8px; }
        .logo-icon { font-size:24px; color:var(--cyan); text-shadow:var(--cyan-glow); animation:logoPulse 2s ease-in-out infinite; }
        @keyframes logoPulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
        .logo-text { font-family:var(--font-display); font-weight:700; font-size:18px; letter-spacing:3px; color:var(--cyan); text-shadow:var(--cyan-glow); }
        .local-time { display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
        .time-display { font-family:var(--font-mono); font-size:20px; font-weight:500; color:var(--magenta); text-shadow:var(--magenta-glow); }
        .time-location { font-family:var(--font-display); font-size:11px; letter-spacing:2px; color:var(--glow-white-dim); }
        .main-content { flex:1; display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; padding:0 20px 20px; gap:16px; }
        .main-content::-webkit-scrollbar { width:3px; }
        .main-content::-webkit-scrollbar-track { background:transparent; }
        .main-content::-webkit-scrollbar-thumb { background:var(--cyan-dim); border-radius:3px; }
        .city-display { text-align:center; padding:8px 0; }
        .city-name { font-family:var(--font-display); font-size:48px; font-weight:700; letter-spacing:8px; line-height:1; color:var(--magenta); text-shadow:0 0 10px var(--magenta),0 0 30px var(--magenta),0 0 60px var(--magenta),0 0 100px var(--magenta); animation:neonFlicker 5s infinite alternate; }
        @keyframes neonFlicker { 0%,19%,21%,23%,25%,54%,56%,100%{opacity:1} 20%,24%,55%{opacity:0.85} }
        .country-name { font-family:var(--font-ui); font-size:14px; letter-spacing:4px; color:var(--glow-white-dim); margin-top:4px; }
        .globe-container { position:relative; width:100%; aspect-ratio:1; max-height:400px; border-radius:var(--radius-lg); overflow:hidden; background:radial-gradient(ellipse at center,rgba(0,240,255,0.05) 0%,transparent 70%); border:1px solid var(--wireframe); }
        .globe-loading { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; z-index:10; background:var(--deep-space); transition:opacity var(--transition-slow); }
        .globe-loading.hidden { opacity:0; pointer-events:none; }
        .loading-pulse { width:40px; height:40px; border-radius:50%; border:2px solid var(--cyan); animation:loadingPulse 1.5s ease-out infinite; }
        @keyframes loadingPulse { 0%{transform:scale(0.8);opacity:1} 100%{transform:scale(2);opacity:0} }
        .globe-loading p { font-family:var(--font-ui); font-size:14px; color:var(--glow-white-dim); }
        .mood-filter { display:flex; justify-content:center; gap:12px; padding:4px 0; }
        .mood-btn { display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 20px; background:transparent; border:1px solid var(--wireframe); border-radius:var(--radius-md); color:var(--glow-white-dim); cursor:pointer; transition:all var(--transition-normal); font-family:var(--font-ui); }
        .mood-btn:hover { border-color:var(--cyan-dim); background:rgba(0,240,255,0.05); }
        .mood-btn.active { border-color:var(--cyan); background:rgba(0,240,255,0.1); color:var(--cyan); box-shadow:var(--cyan-glow); }
        .mood-wave { font-size:24px; font-family:var(--font-display); }
        .mood-label { font-size:11px; letter-spacing:1px; text-transform:uppercase; }
        .stations-panel { background:rgba(26,26,46,0.6); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid var(--wireframe); border-radius:var(--radius-lg); padding:16px; }
        .panel-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
        .panel-title { font-family:var(--font-display); font-size:11px; letter-spacing:3px; color:var(--cyan); text-shadow:var(--cyan-glow); }
        .go-to-area { padding:6px 14px; background:transparent; border:1px solid var(--magenta-dim); border-radius:var(--radius-sm); color:var(--magenta); font-family:var(--font-display); font-size:10px; letter-spacing:1px; cursor:pointer; transition:all var(--transition-normal); }
        .go-to-area:hover { background:rgba(255,0,229,0.1); box-shadow:var(--magenta-glow); }
        .stations-scroll { display:flex; gap:12px; overflow-x:auto; padding-bottom:8px; }
        .stations-scroll::-webkit-scrollbar { height:2px; }
        .stations-scroll::-webkit-scrollbar-thumb { background:var(--cyan-dim); border-radius:2px; }
        .station-card { min-width:160px; padding:12px 16px; background:rgba(0,240,255,0.03); border:1px solid var(--wireframe); border-radius:var(--radius-md); cursor:pointer; transition:all var(--transition-normal); flex-shrink:0; }
        .station-card:hover { border-color:var(--cyan-dim); background:rgba(0,240,255,0.08); }
        .station-card.playing { border-color:var(--cyan); background:rgba(0,240,255,0.12); box-shadow:var(--cyan-glow); }
        .station-name { font-family:var(--font-display); font-size:13px; font-weight:500; color:var(--glow-white); margin-bottom:4px; }
        .station-frequency { font-family:var(--font-mono); font-size:11px; color:var(--glow-white-dim); }
        .station-play-indicator { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--cyan); margin-right:6px; opacity:0; transition:opacity var(--transition-normal); }
        .station-card.playing .station-play-indicator { opacity:1; animation:playPulse 1s ease-in-out infinite; }
        @keyframes playPulse { 0%,100%{box-shadow:0 0 4px var(--cyan)} 50%{box-shadow:0 0 12px var(--cyan)} }
        .nearby-cities { padding:8px 0; }
        .nearby-title { font-family:var(--font-display); font-size:11px; letter-spacing:3px; color:var(--glow-white-dim); margin-bottom:12px; }
        .cities-list { display:flex; flex-wrap:wrap; gap:8px; }
        .city-chip { padding:8px 14px; background:rgba(26,26,46,0.6); border:1px solid var(--wireframe); border-radius:20px; font-family:var(--font-ui); font-size:12px; color:var(--glow-white-dim); cursor:pointer; transition:all var(--transition-normal); display:flex; align-items:center; gap:6px; }
        .city-chip:hover { border-color:var(--cyan-dim); color:var(--glow-white); }
        .city-chip .distance { font-family:var(--font-mono); font-size:10px; color:var(--cyan-dim); }
        .audio-visualizer { display:flex; align-items:center; gap:12px; padding:8px 20px; background:rgba(10,10,20,0.95); border-top:1px solid var(--wireframe); z-index:100; }
        .visualizer-bars { display:flex; align-items:flex-end; gap:2px; height:30px; flex:1; }
        .visualizer-bar { flex:1; background:var(--cyan-dim); border-radius:2px; min-height:3px; transition:height 50ms ease; }
        .visualizer-bar.active { background:var(--cyan); box-shadow:var(--cyan-glow); }
        .now-playing { display:flex; align-items:center; gap:8px; min-width:140px; justify-content:flex-end; }
        .np-dot { width:6px; height:6px; border-radius:50%; background:var(--magenta); opacity:0; transition:opacity var(--transition-normal); }
        .np-dot.playing { opacity:1; animation:playPulse 1s ease-in-out infinite; }
        .np-text { font-family:var(--font-ui); font-size:11px; color:var(--glow-white-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px; }
        @media (min-width:768px) { .app-container{max-width:700px} .city-name{font-size:64px} .globe-container{max-height:500px} }
        @media (max-width:380px) { .city-name{font-size:36px;letter-spacing:4px} .mood-btn{padding:10px 14px} .station-card{min-width:140px} }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">◉</span>
                <span class="logo-text">NEONWAVE</span>
            </div>
            <div class="local-time">
                <span class="time-display">23:53</span>
                <span class="time-location">TYRE</span>
            </div>
        </header>
        <main class="main-content">
            <section class="city-display">
                <h1 class="city-name">TYRE</h1>
                <p class="country-name">LEBANON</p>
            </section>
            <section class="globe-container" id="globeContainer">
                <div class="globe-loading">
                    <div class="loading-pulse"></div>
                    <p>Connecting to the world...</p>
                </div>
            </section>
            <section class="mood-filter">
                <button class="mood-btn" data-mood="calm"><span class="mood-wave">~</span><span class="mood-label">Calm</span></button>
                <button class="mood-btn active" data-mood="balanced"><span class="mood-wave">≈</span><span class="mood-label">Balanced</span></button>
                <button class="mood-btn" data-mood="energetic"><span class="mood-wave">≋</span><span class="mood-label">Energetic</span></button>
            </section>
            <section class="stations-panel">
                <div class="panel-header">
                    <h2 class="panel-title">PICKS FROM THE AREA</h2>
                    <button class="go-to-area">GO TO LEBANON ⤢</button>
                </div>
                <div class="stations-scroll" id="stationsList"></div>
            </section>
            <section class="nearby-cities">
                <h3 class="nearby-title">NEARBY</h3>
                <div class="cities-list" id="nearbyList"></div>
            </section>
        </main>
        <footer class="audio-visualizer">
            <div class="visualizer-bars" id="visualizerBars"></div>
            <div class="now-playing">
                <span class="np-dot"></span>
                <span class="np-text">Select a station</span>
            </div>
        </footer>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
