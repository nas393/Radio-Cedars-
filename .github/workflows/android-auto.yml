name: Build Radio Cedars Android app

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-auto/**'
      - '.github/workflows/android-auto.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x android-auto/gradlew
          cd android-auto
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: radio-cedars-debug-apk
          path: android-auto/app/build/outputs/apk/debug/app-debug.apk
