name: Build Sawt el Beit Android app

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-auto/**'
      - '.github/workflows/android-auto.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build debug APK (install on your phone)
        working-directory: android-auto
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          grep -E "^e: (file|[A-Za-z]+\.kt)|^e: .*\.kt:|What went wrong" -A1 build.log | head -40 | sed 's/^/::error::/'
          exit $code

      - name: Check the car parts of the APK
        shell: bash
        continue-on-error: true
        run: |
          APK=android-auto/app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump xmltree $APK --file AndroidManifest.xml > m.txt 2>&1 || true
          echo "::notice::car: $(grep -ciE 'CarAppService|category.NAVIGATION|minCarApiLevel|MediaBrowserService' m.txt) car entries"
          SIG=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          echo "::notice::verify: $($SIG verify -v $APK 2>&1 | tr '\n' ' ' | cut -c1-600)"
          echo "::notice::size: $(stat -c %s $APK) bytes; minSdk: $($AAPT dump badging $APK | grep -o "sdkVersion:'[0-9]*'")"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sawt-el-beit-apk
          path: android-auto/app/build/outputs/apk/debug/app-debug.apk

      # Play Store bundle — runs only once the signing secrets are added in GitHub settings.
      - name: Build signed Play Store bundle
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android-auto
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew bundleRelease --no-daemon

      - name: Upload Play Store bundle
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: sawt-el-beit-playstore-aab
          path: android-auto/app/build/outputs/bundle/release/app-release.aab
