name: Build Mawja Radio Android app

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-auto/**'
      - '.github/workflows/android-auto.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build debug APK (install on your phone)
        working-directory: android-auto
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mawja-radio-apk
          path: android-auto/app/build/outputs/apk/debug/app-debug.apk

      # Play Store bundle — runs only once the signing secrets are added in GitHub settings.
      - name: Build signed Play Store bundle
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android-auto
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew bundleRelease --no-daemon

      - name: Upload Play Store bundle
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: mawja-radio-playstore-aab
          path: android-auto/app/build/outputs/bundle/release/app-release.aab
